# 근사 노선 정의 (docs/data-licenses.md 1장 "근사 안내").
# 시간표 데이터를 상업적으로 쓸 수 없는 노선을 요약 사실(역 순서, 전 구간 소요 시간, 시간대별 배차 간격)로
# 근사한다. 역 위치는 국토수치정보 N02(CC BY 4.0)에서 운영사 + 역 이름으로 찾는다.
# 이 노선의 모든 구간은 앱에서 "예상"으로 표시한다(lines.estimated = true).
#
# headways: [시작 "HH:MM", 끝 "HH:MM", 간격(분)]. 끝이 24:00을 넘으면 "24:30"처럼 적는다.
# facts: 각 값의 근거. "추정"은 출처 없이 정한 값이라 실측·평가로 보정해야 한다.

