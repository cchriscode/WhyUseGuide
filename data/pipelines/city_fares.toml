# 도시별 근사 운임 (PRD §5.3 "근사 운임은 도시별 운임표 구간값을 쓴다", cities.fare_table).
# 사람이 공식 공개 자료에서 확인한 요약 사실이다. 운임이 개정되면 여기를 고치고 다시 적재한다:
#     uv run wug-data load-fares
# checked: 마지막으로 출처와 대조한 날. source: 근거. "가정"은 출처 없이 정한 값.
#
# transit.bands: [이 km까지, 성인 운임]. 엔진은 경로 km(직선 × 1.3)로 구간을 고른다.
#   운영사를 갈아타면 실제 운임은 더 나온다(운영사마다 따로 계산). 근사라서 한 운영사 기준만 쓴다.
# taxi: 기본 운임(base_km까지 base), 이후 add_m 미터마다 add_fare. 시간 병산·심야 할증은 넣지 않는다.
# car: 유류비 = 경로 km × (gasoline_per_liter ÷ km_per_liter).

[tokyo]
checked = "2026-11-16"

[tokyo.transit]
source = "도쿄메트로 보통 여객 운임(성인, 승차권 구입 시 10엔 단위, 2023-03-18 개정). 금액은 ODPT odpt:RailwayFare(dc:date 2023-03-18)의 ticketFare로 대조, km 구간은 도쿄메트로 운임 개정 신청 자료(2019)의 영업 km 구분."
bands = [[6, 180], [11, 210], [19, 260], [27, 300], [40, 330]]

[tokyo.taxi]
source = "특별구·무산(武三) 교통권 공정폭 운임. 간토운수국장 2026-03-19 공시, 2026-04-20 시행(상한 운임). 국제자동차(km택시) 2026-04-16 공지로 확인."
base = 500
base_km = 1.0
add_fare = 100
add_m = 232

[tokyo.car]
source = "휘발유: 자원에너지청 석유제품가격조사 레귤러 전국 평균 169.9엔/L(2026-11-09). 연비 14km/L는 가정(소형 렌터카 실주행)."
gasoline_per_liter = 169.9
km_per_liter = 14
