# 한국어 이름 편집 목록. 기계 변환(ko_names.py, 국립국어원 일본어 표기법)보다 우선한다.
# 여기 있는 이름은 name_ko_source = "editor"로 저장되어 "기계 번역" 표시가 붙지 않는다.
# 키는 현지어 이름(name_local). 관용이 표기법과 다른 이름, 규칙으로 변환할 수 없는 이름을 넣는다.

[lines]
"日暮里・舎人ライナー" = "닛포리·도네리 라이너"
"東京さくらトラム（都電荒川線）" = "도쿄 사쿠라 트램(도덴 아라카와선)"

[stops]
"高輪ゲートウェイ" = "다카나와 게이트웨이"
