# 유리카모메: GTFS가 없고 역 시간표(JSON)만 있다. 아래 네 재료를 받아 build-odpt-gtfs로 GTFS를 만든다.

[[source]]
id = "yurikamome-odpt-operator"
kind = "file"
url = "https://api.odpt.org/api/v4/odpt:Operator?owl:sameAs=odpt.Operator:Yurikamome"
save_as = "operator.json"
license = "公共交通オープンデータ基本ライセンス"
attribution = "ゆりかもめ・公共交通オープンデータセンター"
refresh = "weekly"
otp = false
token_env = "ODPT_TOKEN"

[[source]]
id = "yurikamome-odpt-railway"
kind = "file"
url = "https://api.odpt.org/api/v4/odpt:Railway?odpt:operator=odpt.Operator:Yurikamome"
save_as = "railway.json"
license = "公共交通オープンデータ基本ライセンス"
attribution = "ゆりかもめ・公共交通オープンデータセンター"
refresh = "weekly"
otp = false
token_env = "ODPT_TOKEN"

[[source]]
id = "yurikamome-odpt-stations"
kind = "file"
url = "https://api.odpt.org/api/v4/odpt:Station?odpt:operator=odpt.Operator:Yurikamome"
save_as = "stations.json"
license = "公共交通オープンデータ基本ライセンス"
attribution = "ゆりかもめ・公共交通オープンデータセンター"
refresh = "weekly"
otp = false
token_env = "ODPT_TOKEN"

[[source]]
id = "yurikamome-odpt-timetables"
kind = "file"
url = "https://api.odpt.org/api/v4/odpt:StationTimetable?odpt:operator=odpt.Operator:Yurikamome"
save_as = "station_timetables.json"
license = "公共交通オープンデータ基本ライセンス"
attribution = "ゆりかもめ・公共交通オープンデータセンター"
refresh = "weekly"
otp = false
token_env = "ODPT_TOKEN"

[[source]]
id = "yurikamome-odpt-fares"
kind = "file"
url = "https://api.odpt.org/api/v4/odpt:RailwayFare?odpt:operator=odpt.Operator:Yurikamome"
save_as = "fares.json"
license = "公共交通オープンデータ基本ライセンス"
attribution = "ゆりかもめ・公共交通オープンデータセンター"
refresh = "weekly"
otp = false
token_env = "ODPT_TOKEN"

[[source]]
id = "yurikamome-train-gtfs"
kind = "gtfs"
url = "local:odpt-station-timetable"
license = "公共交通オープンデータ基本ライセンス"
attribution = "ゆりかもめ・公共交通オープンデータセンター"
refresh = "weekly"
otp = true
city = "tokyo"
inputs = { operator = "yurikamome-odpt-operator", railway = "yurikamome-odpt-railway", stations = "yurikamome-odpt-stations", timetables = "yurikamome-odpt-timetables", fares = "yurikamome-odpt-fares" }
