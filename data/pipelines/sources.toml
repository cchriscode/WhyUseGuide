# 데이터 출처 목록 (PRD §8 data_sources). 상업 이용 가능 여부는 docs/data-licenses.md.
# kind: gtfs = OTP 그래프 입력 후보, file = 그 밖의 원자료
# city: gtfs 출처의 역·노선을 적재할 도시 코드(cities.code)
# url이 "local:"이면 받지 않고 이 저장소에서 만든다(build-approx). estimated = true면 노선을 "예상"으로 적재한다.
# kind = "sparql"이면 query 파일(data/pipelines 기준 경로)을 url의 SPARQL 엔드포인트에 보내 JSON으로 받는다.

[[source]]
id = "toei-train-gtfs"
kind = "gtfs"
url = "https://api-public.odpt.org/api/v4/files/Toei/data/Toei-Train-GTFS.zip"
license = "CC BY 4.0"
attribution = "東京都交通局・公共交通オープンデータセンター (CC BY 4.0)"
refresh = "weekly"
otp = true
city = "tokyo"

[[source]]
id = "mlit-n02-2025"
kind = "file"
url = "https://nlftp.mlit.go.jp/ksj/gml/data/N02/N02-25/N02-25_GML.zip"
license = "CC BY 4.0"
attribution = "「国土数値情報（鉄道データ）」（国土交通省）を加工して作成"
refresh = "yearly"
otp = false

[[source]]
id = "cao-holidays"
kind = "file"
url = "https://www8.cao.go.jp/chosei/shukujitsu/syukujitsu.csv"
license = "公共データ利用規約 第1.0版 (CC BY 4.0 호환)"
attribution = "出典：内閣府ホームページ (https://www8.cao.go.jp/chosei/shukujitsu/gaiyou.html)"
refresh = "yearly"
otp = false

[[source]]
id = "approx-tokyo"
kind = "gtfs"
url = "local:approx_lines.toml"
license = "CC BY 4.0 (국토수치정보 N02) + 자체 요약 사실"
attribution = "「国土数値情報（鉄道データ）」（国土交通省）を加工して作成"
refresh = "시간표 개정 때"
otp = true
city = "tokyo"
estimated = true

[[source]]
id = "wikidata-tokyo-places"
kind = "sparql"
url = "https://query.wikidata.org/sparql"
query = "queries/wikidata_tokyo_places.rq"
license = "CC0 1.0"
attribution = "Wikidata (CC0)"
refresh = "monthly"
otp = false
city = "tokyo"

