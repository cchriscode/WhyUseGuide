[project]
name = "whyuseguide"
version = "0.0.0"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/api", "services/engine"]

[tool.uv.sources]
itinerary-engine = { workspace = true }
whyuse-api = { workspace = true }

[dependency-groups]
dev = [
  "itinerary-engine",
  "whyuse-api",
  "pytest>=8",
  "ruff>=0.7",
  "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["whyuse_api", "itinerary_engine"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["whyuse_api", "itinerary_engine"]
mypy_path = ["services/api/src", "services/engine/src"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests", "services/engine/tests"]
addopts = "--import-mode=importlib"
