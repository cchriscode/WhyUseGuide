[project]
name = "whyuse-api"
version = "0.0.0"
description = "FastAPI 서버 (PRD §7)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "itinerary-engine",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "redis>=5.2",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whyuse_api"]
