[project]
name = "whyuseguide-engine"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "itinerary_engine"

[tool.pytest.ini_options]
testpaths = ["tests"]
